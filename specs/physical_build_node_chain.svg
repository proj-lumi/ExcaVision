<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3000" viewBox="0 0 1800 3000">
  <title>ExcaVision direct-mating vertical node chain</title>
  <desc>Three vertical 2.667 metre sensor modules directly connected by male and female combined connectors with no cable between modules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#263238"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1565c0"/></marker>
    <style>
      .title{font:700 36px Arial;fill:#102027}.sub{font:400 21px Arial;fill:#455a64}
      .h{font:700 23px Arial;fill:#102027}.txt{font:400 19px Arial;fill:#37474f}
      .small{font:400 16px Arial;fill:#455a64}.dim{font:700 18px Arial;fill:#263238}
      .module{fill:#eceff1;stroke:#455a64;stroke-width:4}.blank{fill:#fafafa;stroke:#90a4ae;stroke-width:2;stroke-dasharray:7 7}
      .sensor{fill:#fff3e0;stroke:#ef6c00;stroke-width:4}.box{fill:#e3f2fd;stroke:#1565c0;stroke-width:4}
      .board{fill:white;stroke:#1976d2;stroke-width:2}.male{fill:#90caf9;stroke:#0d47a1;stroke-width:3}.female{fill:#ffcc80;stroke:#e65100;stroke-width:3}
      .direct{stroke:#6a1b9a;stroke-width:8}.power{stroke:#2e7d32;stroke-width:6}.bus{stroke:#1565c0;stroke-width:6}
      .guide{stroke:#90a4ae;stroke-width:2;stroke-dasharray:6 6;fill:none}.measure{stroke:#263238;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow);fill:none}
    </style>
  </defs>
  <rect width="1800" height="3000" fill="white"/>
  <text x="70" y="65" class="title">ExcaVision — Direct-Mating Vertical Node Chain</text>
  <text x="70" y="102" class="sub">No wire between modules • UPSTREAM male mates directly with DOWNSTREAM female • RS-485 + 5 V pass through</text>

  <!-- Gateway external power -->
  <rect x="660" y="130" width="340" height="72" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="830" y="160" text-anchor="middle" class="h">5 V USB SUPPLY</text>
  <text x="830" y="187" text-anchor="middle" class="small">external lead enters gateway only</text>
  <path d="M830 202 L830 250" class="power" marker-end="url(#arrow)"/>

  <!-- Node helper: each module from y 250 to 1070, 1100 to 1920, 1950 to 2770 -->
  <!-- Node 1 -->
  <rect x="600" y="250" width="460" height="820" rx="18" class="module"/>
  <rect x="580" y="250" width="500" height="38" rx="8" class="male"/>
  <text x="830" y="277" text-anchor="middle" class="h">NODE 1 — GATEWAY • UPSTREAM MALE</text>
  <rect x="620" y="292" width="420" height="88" class="blank"/>
  <text x="830" y="340" text-anchor="middle" class="txt">33.3 cm blank end</text>
  <circle cx="830" cy="405" r="34" class="sensor"/><text x="830" y="401" text-anchor="middle" class="h">S1</text><text x="830" y="426" text-anchor="middle" class="small">ch7</text>
  <circle cx="830" cy="550" r="34" class="sensor"/><text x="830" y="546" text-anchor="middle" class="h">S2</text><text x="830" y="571" text-anchor="middle" class="small">ch3</text>
  <rect x="670" y="620" width="320" height="180" rx="14" class="box"/>
  <text x="830" y="653" text-anchor="middle" class="h">CENTER IP65 ENCLOSURE</text>
  <rect x="695" y="675" width="125" height="75" rx="8" class="board"/><text x="757" y="715" text-anchor="middle" class="txt">ESP32</text><text x="757" y="738" text-anchor="middle" class="small">GPIO 21/22</text>
  <rect x="840" y="675" width="125" height="75" rx="8" class="board"/><text x="902" y="715" text-anchor="middle" class="txt">TCA</text><text x="902" y="738" text-anchor="middle" class="small">0x70</text>
  <text x="830" y="778" text-anchor="middle" class="small">one RS-485 module + distribution</text>
  <circle cx="830" cy="875" r="34" class="sensor"/><text x="830" y="871" text-anchor="middle" class="h">S3</text><text x="830" y="896" text-anchor="middle" class="small">ch5</text>
  <circle cx="830" cy="1015" r="34" class="sensor"/><text x="830" y="1011" text-anchor="middle" class="h">S4</text><text x="830" y="1036" text-anchor="middle" class="small">ch1</text>
  <rect x="620" y="1030" width="420" height="40" class="blank"/><text x="830" y="1057" text-anchor="middle" class="small">33.3 cm blank end</text>
  <rect x="580" y="1070" width="500" height="38" rx="8" class="female"/><text x="830" y="1097" text-anchor="middle" class="h">DOWNSTREAM FEMALE</text>

  <!-- direct joint 1 -->
  <rect x="580" y="1070" width="500" height="38" rx="8" class="female"/>
  <rect x="580" y="1100" width="500" height="38" rx="8" class="male"/>
  <line x1="600" y1="1100" x2="1060" y2="1100" class="direct"/>
  <text x="1110" y="1108" class="h">DIRECT JOINT</text><text x="1110" y="1137" class="txt">female ↔ male</text><text x="1110" y="1164" class="txt">no cable</text>
  <text x="470" y="1120" text-anchor="middle" transform="rotate(-90 470 1120)" class="small">A • B • GND • +5V • GND pass through connector</text>

  <!-- Node 2 -->
  <rect x="600" y="1138" width="460" height="820" rx="18" class="module"/>
  <rect x="580" y="1100" width="500" height="38" rx="8" class="male"/><text x="830" y="1127" text-anchor="middle" class="h">NODE 2 • UPSTREAM MALE</text>
  <rect x="620" y="1140" width="420" height="70" class="blank"/><text x="830" y="1182" text-anchor="middle" class="small">33.3 cm blank end</text>
  <circle cx="830" cy="1235" r="34" class="sensor"/><text x="830" y="1231" text-anchor="middle" class="h">S1</text><text x="830" y="1256" text-anchor="middle" class="small">ch7</text>
  <circle cx="830" cy="1380" r="34" class="sensor"/><text x="830" y="1376" text-anchor="middle" class="h">S2</text><text x="830" y="1401" text-anchor="middle" class="small">ch3</text>
  <rect x="670" y="1450" width="320" height="180" rx="14" class="box"/><text x="830" y="1483" text-anchor="middle" class="h">CENTER IP65 ENCLOSURE</text><text x="830" y="1525" text-anchor="middle" class="txt">ESP32 + TCA + one RS-485</text><text x="830" y="1555" text-anchor="middle" class="small">all boards on standoffs</text>
  <circle cx="830" cy="1705" r="34" class="sensor"/><text x="830" y="1701" text-anchor="middle" class="h">S3</text><text x="830" y="1726" text-anchor="middle" class="small">ch5</text>
  <circle cx="830" cy="1845" r="34" class="sensor"/><text x="830" y="1841" text-anchor="middle" class="h">S4</text><text x="830" y="1866" text-anchor="middle" class="small">ch1</text>
  <rect x="620" y="1885" width="420" height="35" class="blank"/><text x="830" y="1910" text-anchor="middle" class="small">33.3 cm blank end</text>
  <rect x="580" y="1920" width="500" height="38" rx="8" class="female"/><text x="830" y="1947" text-anchor="middle" class="h">DOWNSTREAM FEMALE</text>

  <!-- direct joint 2 -->
  <rect x="580" y="1920" width="500" height="38" rx="8" class="female"/>
  <rect x="580" y="1950" width="500" height="38" rx="8" class="male"/><line x1="600" y1="1950" x2="1060" y2="1950" class="direct"/>
  <text x="1110" y="1958" class="h">DIRECT JOINT</text><text x="1110" y="1987" class="txt">female ↔ male</text><text x="1110" y="2014" class="txt">no cable</text>

  <!-- Node 3 -->
  <rect x="600" y="1988" width="460" height="820" rx="18" class="module"/>
  <rect x="580" y="1950" width="500" height="38" rx="8" class="male"/><text x="830" y="1977" text-anchor="middle" class="h">NODE 3 • UPSTREAM MALE</text>
  <rect x="620" y="1990" width="420" height="70" class="blank"/><text x="830" y="2032" text-anchor="middle" class="small">33.3 cm blank end</text>
  <circle cx="830" cy="2085" r="34" class="sensor"/><text x="830" y="2081" text-anchor="middle" class="h">S1</text><text x="830" y="2106" text-anchor="middle" class="small">ch7</text>
  <circle cx="830" cy="2230" r="34" class="sensor"/><text x="830" y="2226" text-anchor="middle" class="h">S2</text><text x="830" y="2251" text-anchor="middle" class="small">ch3</text>
  <rect x="670" y="2300" width="320" height="180" rx="14" class="box"/><text x="830" y="2333" text-anchor="middle" class="h">CENTER IP65 ENCLOSURE</text><text x="830" y="2375" text-anchor="middle" class="txt">ESP32 + TCA + one RS-485</text><text x="830" y="2405" text-anchor="middle" class="small">all boards on standoffs</text>
  <circle cx="830" cy="2555" r="34" class="sensor"/><text x="830" y="2551" text-anchor="middle" class="h">S3</text><text x="830" y="2576" text-anchor="middle" class="small">ch5</text>
  <circle cx="830" cy="2695" r="34" class="sensor"/><text x="830" y="2691" text-anchor="middle" class="h">S4</text><text x="830" y="2716" text-anchor="middle" class="small">ch1</text>
  <rect x="580" y="2770" width="500" height="38" rx="8" class="male"/><text x="830" y="2797" text-anchor="middle" class="h">BOTTOM UPSTREAM/EXPOSED MALE — CAP IT</text>

  <!-- Left dimensions -->
  <line x1="250" y1="292" x2="250" y2="405" class="measure"/><text x="220" y="350" text-anchor="middle" transform="rotate(-90 220 350)" class="dim">33.3 cm</text>
  <line x1="310" y1="405" x2="310" y2="550" class="measure"/><text x="280" y="480" text-anchor="middle" transform="rotate(-90 280 480)" class="dim">66.67 cm</text>
  <line x1="310" y1="550" x2="310" y2="875" class="measure"/><text x="280" y="715" text-anchor="middle" transform="rotate(-90 280 715)" class="dim">center enclosure zone</text>
  <line x1="300" y1="250" x2="300" y2="1108" class="measure"/><text x="260" y="680" text-anchor="middle" transform="rotate(-90 260 680)" class="dim">2.667 m module pitch</text>
  <line x1="350" y1="1070" x2="350" y2="1100" class="measure"/><text x="375" y="1090" class="dim">direct mate</text>
  <line x1="350" y1="1070" x2="350" y2="1235" class="measure"/><text x="375" y="1170" class="dim">66.67 cm S4→S1</text>

  <!-- Right callouts -->
  <rect x="1210" y="350" width="490" height="470" rx="16" fill="#f5f5f5" stroke="#b0bec5" stroke-width="2"/>
  <text x="1240" y="395" class="h">One-node electrical meaning</text>
  <text x="1240" y="440" class="txt">UPSTREAM male pins:</text>
  <text x="1270" y="470" class="txt">A • B • RS485 GND • +5V • GND</text>
  <text x="1240" y="520" class="txt">DOWNSTREAM female pins:</text>
  <text x="1270" y="550" class="txt">same signals, pass-through</text>
  <path d="M1260 600 L1650 600" class="bus"/><text x="1240" y="635" class="txt">A/B = shared bidirectional bus</text>
  <path d="M1260 690 L1650 690" class="power"/><text x="1240" y="725" class="txt">+5V/GND = local power + next node</text>
  <text x="1240" y="780" class="small">The connector is not “RS-485 in” or “out”.</text>
  <text x="1240" y="805" class="small">UP/DOWN only prevents assembly mistakes.</text>

  <rect x="1210" y="900" width="490" height="380" rx="16" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1240" y="945" class="h">Mechanical joint</text>
  <text x="1240" y="990" class="txt">1. Align guide rails/pins.</text>
  <text x="1240" y="1025" class="txt">2. Slide lower module upward.</text>
  <text x="1240" y="1060" class="txt">3. Male enters female connector.</text>
  <text x="1240" y="1095" class="txt">4. Latch/clamp carries the load.</text>
  <text x="1240" y="1160" class="small">The connector must not carry the</text>
  <text x="1240" y="1185" class="small">weight of the lower PVC module alone.</text>
  <text x="1240" y="1235" class="small">Use keyed, current-rated connectors.</text>

  <rect x="1210" y="1370" width="490" height="300" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1240" y="1415" class="h">Power rule</text>
  <text x="1240" y="1460" class="txt">Only gateway has external USB 5 V lead.</text>
  <text x="1240" y="1500" class="txt">Every direct joint passes +5V/GND.</text>
  <text x="1240" y="1540" class="txt">Maximum prototype: 3 nodes.</text>
  <text x="1240" y="1595" class="small">For longer chains, use local power or</text>
  <text x="1240" y="1620" class="small">higher-voltage distribution + buck converters.</text>

  <text x="70" y="2940" class="small">Illustration: dimensions are module mating-face to mating-face. Sensor marks must be measured on the physical rail during assembly.</text>
</svg>
