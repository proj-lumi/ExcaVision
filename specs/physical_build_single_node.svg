<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <title>ExcaVision single vertical node layout</title>
  <defs>
    <style>
      .title{font:700 32px Arial;fill:#102027}.sub{font:400 18px Arial;fill:#455a64}
      .h{font:700 22px Arial;fill:#102027}.txt{font:400 18px Arial;fill:#263238}.small{font:400 15px Arial;fill:#455a64}
      .rail{fill:#eceff1;stroke:#455a64;stroke-width:4}.sensor{fill:#fff3e0;stroke:#ef6c00;stroke-width:3}
      .box{fill:#e3f2fd;stroke:#1565c0;stroke-width:3}.male{fill:#bbdefb;stroke:#1565c0;stroke-width:3}
      .female{fill:#ffe0b2;stroke:#ef6c00;stroke-width:3}.dim{stroke:#263238;stroke-width:2;marker-start:url(#a);marker-end:url(#a);fill:none}
      .guide{stroke:#90a4ae;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263238"/></marker>
  </defs>
  <rect width="1200" height="1800" fill="white"/>
  <text x="50" y="55" class="title">One ExcaVision Node — Vertical Physical Layout</text>
  <text x="50" y="88" class="sub">One 2.667 m module • sensor spacing is 66.67 cm everywhere, including between modules</text>

  <rect x="310" y="150" width="180" height="1450" rx="18" class="rail"/>
  <text x="400" y="130" text-anchor="middle" class="h">PVC rail / conduit</text>
  <text x="400" y="1640" text-anchor="middle" class="small">clamp rail so it cannot slide or rotate</text>

  <rect x="275" y="150" width="250" height="46" rx="9" class="male"/>
  <text x="400" y="180" text-anchor="middle" class="h">UPSTREAM • GX12-6 MALE</text>
  <rect x="345" y="208" width="110" height="170" class="guide"/>
  <text x="400" y="300" text-anchor="middle" class="txt">33.3 cm</text>
  <text x="400" y="326" text-anchor="middle" class="small">blank end</text>

  <circle cx="400" cy="430" r="48" class="sensor"/><text x="400" y="424" text-anchor="middle" class="h">S1</text><text x="400" y="449" text-anchor="middle" class="small">ch7</text>
  <circle cx="400" cy="730" r="48" class="sensor"/><text x="400" y="724" text-anchor="middle" class="h">S2</text><text x="400" y="749" text-anchor="middle" class="small">ch3</text>

  <rect x="330" y="825" width="140" height="150" rx="12" class="box"/>
  <text x="400" y="865" text-anchor="middle" class="h">CENTER</text>
  <text x="400" y="895" text-anchor="middle" class="txt">ESP32</text>
  <text x="400" y="922" text-anchor="middle" class="txt">TCA</text>
  <text x="400" y="949" text-anchor="middle" class="txt">MAX485</text>

  <circle cx="400" cy="1075" r="48" class="sensor"/><text x="400" y="1069" text-anchor="middle" class="h">S3</text><text x="400" y="1094" text-anchor="middle" class="small">ch5</text>
  <circle cx="400" cy="1375" r="48" class="sensor"/><text x="400" y="1369" text-anchor="middle" class="h">S4</text><text x="400" y="1394" text-anchor="middle" class="small">ch1</text>

  <rect x="345" y="1427" width="110" height="145" class="guide"/>
  <text x="400" y="1502" text-anchor="middle" class="txt">33.3 cm</text>
  <text x="400" y="1528" text-anchor="middle" class="small">blank end</text>
  <rect x="275" y="1554" width="250" height="46" rx="9" class="female"/>
  <text x="400" y="1584" text-anchor="middle" class="h">DOWNSTREAM • GX12-6 FEMALE</text>

  <line x1="160" y1="150" x2="160" y2="430" class="dim"/><text x="130" y="300" text-anchor="middle" transform="rotate(-90 130 300)" class="txt">33.3 cm</text>
  <line x1="210" y1="430" x2="210" y2="730" class="dim"/><text x="180" y="580" text-anchor="middle" transform="rotate(-90 180 580)" class="txt">66.67 cm</text>
  <line x1="210" y1="730" x2="210" y2="1075" class="dim"/><text x="180" y="900" text-anchor="middle" transform="rotate(-90 180 900)" class="small">center electronics zone</text>
  <line x1="210" y1="1075" x2="210" y2="1375" class="dim"/><text x="180" y="1225" text-anchor="middle" transform="rotate(-90 180 1225)" class="txt">66.67 cm</text>
  <line x1="80" y1="150" x2="80" y2="1600" class="dim"/><text x="55" y="875" text-anchor="middle" transform="rotate(-90 55 875)" class="txt">2.667 m module pitch</text>

  <rect x="650" y="230" width="480" height="1050" rx="16" fill="#f8fafb" stroke="#90a4ae" stroke-width="2"/>
  <text x="680" y="275" class="h">What is physically inside this node?</text>
  <text x="680" y="325" class="txt">S1, S2, S3, S4:</text><text x="710" y="355" class="txt">four screwed sensor brackets</text>
  <text x="680" y="410" class="txt">Center enclosure:</text><text x="710" y="440" class="txt">ESP32 + TCA9548A + MAX485</text>
  <text x="680" y="495" class="txt">Sensor cables:</text><text x="710" y="525" class="txt">four separate Cat6 drops, each ≤1 m</text>
  <text x="680" y="580" class="txt">Top/bottom joint:</text><text x="710" y="610" class="txt">GX12-6 male/female direct mate</text>
  <text x="680" y="665" class="txt">GX12-6 contacts carry:</text><text x="710" y="695" class="txt">A, B, +5V, GND</text>
  <line x1="680" y1="735" x2="1090" y2="735" class="guide"/>
  <text x="680" y="785" class="h">Mechanical securing</text>
  <text x="680" y="830" class="txt">• boards: screws + M2/M3 standoffs</text>
  <text x="680" y="870" class="txt">• MPUs: screws into printed brackets</text>
  <text x="680" y="910" class="txt">• wires: solder/locking terminals</text>
  <text x="680" y="950" class="txt">• cables: clamps + service loop</text>
  <text x="680" y="990" class="txt">• enclosure: IP65 box + cable glands</text>
  <text x="680" y="1030" class="txt">• modules: guide rails + separate latch</text>
  <text x="680" y="1070" class="txt">  (GX12 connector is not structural)</text>
  <rect x="680" y="1120" width="410" height="105" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="700" y="1155" class="txt">TOP = UPSTREAM male</text>
  <text x="700" y="1185" class="txt">BOTTOM = DOWNSTREAM female</text>
  <text x="700" y="1215" class="small">Keep every node facing the same way.</text>
</svg>
