<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <title>GY-521 MPU6050 to Cat6 wiring</title>
  <desc>Clean wiring diagram showing the four required GY-521 pins connected through one Cat6 cable. Three Cat6 ground conductors join the single GY-521 GND pin. XDA, XCL, AD0 and INT are not connected.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102027}.sub{font:400 20px Arial,sans-serif;fill:#455a64}
      .head{font:700 23px Arial,sans-serif;fill:#102027}.label{font:700 20px Arial,sans-serif;fill:#102027}
      .body{font:400 19px Arial,sans-serif;fill:#263238}.small{font:400 16px Arial,sans-serif;fill:#455a64}
      .board{fill:#1565c0;stroke:#0d47a1;stroke-width:4}.pad{fill:#fff3e0;stroke:#ef6c00;stroke-width:3}
      .cable{fill:#f5f5f5;stroke:#607d8b;stroke-width:3}.table{fill:#ffffff;stroke:#b0bec5;stroke-width:2}
      .req{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.nc{fill:#ffebee;stroke:#c62828;stroke-width:2}
      .sda{stroke:#ef6c00;stroke-width:6;fill:none}.scl{stroke:#2e7d32;stroke-width:6;fill:none}
      .pwr{stroke:#1565c0;stroke-width:6;fill:none}.gnd{stroke:#455a64;stroke-width:6;stroke-dasharray:10 7;fill:none}
      .spare{stroke:#90a4ae;stroke-width:4;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="70" y="65" class="title">GY-521 MPU6050 → Cat6 Sensor Cable</text>
  <text x="70" y="102" class="sub">Use one short custom Cat6 drop • maximum 1 m • four board pins used • auxiliary pins left open</text>

  <!-- Board representation -->
  <rect x="90" y="180" width="390" height="700" rx="18" class="board"/>
  <text x="285" y="235" text-anchor="middle" fill="white" style="font:700 25px Arial">GY-521 / MPU6050</text>
  <text x="285" y="270" text-anchor="middle" fill="#dbeafe" style="font:400 17px Arial">same pin order as the pictured board</text>

  <!-- required pins -->
  <rect x="135" y="325" width="300" height="58" rx="10" class="pad"/>
  <text x="160" y="362" class="label">VCC</text><text x="300" y="362" class="body">+5 V supply</text>
  <rect x="135" y="405" width="300" height="58" rx="10" class="pad"/>
  <text x="160" y="442" class="label">GND</text><text x="300" y="442" class="body">one board ground pad</text>
  <rect x="135" y="485" width="300" height="58" rx="10" class="pad"/>
  <text x="160" y="522" class="label">SCL</text><text x="300" y="522" class="body">I²C clock</text>
  <rect x="135" y="565" width="300" height="58" rx="10" class="pad"/>
  <text x="160" y="602" class="label">SDA</text><text x="300" y="602" class="body">I²C data</text>

  <!-- no connect pins -->
  <rect x="135" y="680" width="300" height="42" rx="8" class="nc"/>
  <text x="160" y="708" class="label">XDA · XCL · AD0 · INT</text>
  <text x="160" y="750" fill="#b71c1c" style="font:700 17px Arial">DO NOT CONNECT</text>
  <text x="160" y="782" fill="#b71c1c" style="font:400 16px Arial">These auxiliary pins are not used.</text>

  <!-- cable -->
  <rect x="610" y="180" width="510" height="700" rx="18" class="cable"/>
  <text x="865" y="235" text-anchor="middle" class="head">ONE CAT6 DROP</text>
  <text x="865" y="270" text-anchor="middle" class="small">cut/terminated with the custom sensor pinout</text>

  <!-- cables as rows -->
  <rect x="650" y="320" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="359" class="label">Orange/white</text><text x="900" y="359" class="body">SDA</text>
  <rect x="650" y="400" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="439" class="label">Orange</text><text x="900" y="439" class="body">GND</text>
  <rect x="650" y="480" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="519" class="label">Green/white</text><text x="900" y="519" class="body">SCL</text>
  <rect x="650" y="560" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="599" class="label">Green</text><text x="900" y="599" class="body">GND</text>
  <rect x="650" y="640" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="679" class="label">Blue/white</text><text x="900" y="679" class="body">+5 V</text>
  <rect x="650" y="720" width="430" height="62" rx="10" class="req"/>
  <text x="675" y="759" class="label">Blue</text><text x="900" y="759" class="body">GND</text>
  <rect x="650" y="800" width="430" height="42" rx="8" class="nc"/>
  <text x="675" y="828" class="label">Brown pair</text><text x="900" y="828" class="body">spare / leave open</text>

  <!-- wires from board to cable rows -->
  <path d="M435 594 C520 594 545 350 650 350" class="sda"/>
  <path d="M435 434 C520 434 555 430 650 430" class="gnd"/>
  <path d="M435 514 C520 514 555 510 650 510" class="scl"/>
  <path d="M435 434 C525 434 570 590 650 590" class="gnd"/>
  <path d="M435 354 C535 354 570 670 650 670" class="pwr"/>
  <path d="M435 434 C525 434 580 750 650 750" class="gnd"/>

  <!-- TCA end -->
  <rect x="1270" y="180" width="440" height="700" rx="18" class="table"/>
  <text x="1490" y="235" text-anchor="middle" class="head">TCA9548A END</text>
  <text x="1490" y="270" text-anchor="middle" class="small">all three GND conductors join one common ground</text>

  <text x="1310" y="335" class="label">S1 cable</text><text x="1310" y="370" class="body">SDA + SCL → TCA channel 7</text>
  <text x="1310" y="415" class="label">S2 cable</text><text x="1310" y="450" class="body">SDA + SCL → TCA channel 3</text>
  <text x="1310" y="495" class="label">S3 cable</text><text x="1310" y="530" class="body">SDA + SCL → TCA channel 5</text>
  <text x="1310" y="575" class="label">S4 cable</text><text x="1310" y="610" class="body">SDA + SCL → TCA channel 1</text>

  <rect x="1310" y="665" width="350" height="145" rx="12" class="req"/>
  <text x="1335" y="703" class="label">At the sensor connector:</text>
  <text x="1335" y="738" class="body">SDA + SCL → selected TCA channel</text>
  <text x="1335" y="772" class="body">+5V → VCC • GND wires → common GND</text>
  <text x="1335" y="800" class="small">Use solder, ferrules, or locking terminals.</text>

  <!-- Notes -->
  <rect x="90" y="945" width="1620" height="100" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="120" y="985" class="label">Important:</text>
  <text x="260" y="985" class="body">This is a custom cable. Do not connect it to Ethernet networking equipment or PoE.</text>
  <text x="120" y="1018" class="body">The three Cat6 GND conductors are not three board pins — they are parallel return paths soldered/terminated to the GY-521's one GND pin.</text>
</svg>
