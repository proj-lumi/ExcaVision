[platformio]
default_envs = staging

[env]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/load_environment.py
lib_deps =
    tzapu/WiFiManager@2.0.17
build_flags =
    -Wall
    -Wextra
    ; The Arduino core's own log strings are dead weight in the field build.
    -DCORE_DEBUG_LEVEL=0
    ; WiFiManager's help page is never reachable from our trimmed menu.
    -DWM_NOHELP
monitor_filters =
    esp32_exception_decoder

; One universal production binary for both Gateways and slave nodes.
; The Gateway role is selected at runtime by the physical topmost-node action.
[env:production]
build_flags =
    ${env.build_flags}
    -DEXCAVISION_CONFIG_PRODUCTION

[env:staging]
build_flags =
    ${env.build_flags}
    -DEXCAVISION_CONFIG_STAGING
